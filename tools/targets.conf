# Folders tools/link.sh symlinks each skill into. One path per line; ~ is expanded.
# A line is used only if its parent folder exists (i.e. that agent is installed).
#
# [general]     The symlink mechanism works for every harness that reads SKILL.md folders.
# [third-party] These paths are per-tool conventions taken from community tables
#               (e.g. the `skills` CLI README), not from each vendor's docs. Verify each
#               against the tool's own documentation before relying on it.
#
# Enable only ONE folder per agent, or the agent may load the same skill twice.

~/.codex/skills          # OpenAI Codex CLI
~/.copilot/skills        # GitHub Copilot (CLI / VS Code agent mode)
~/.cursor/skills         # Cursor
~/.gemini/skills         # Gemini CLI

# ~/.agents/skills       # shared folder some agents read; enable only if your agents use it
#                         # instead of their own folder above

# [claude] Claude Code. Leave disabled if your skills reach Claude Code through the
# claude.ai account sync (Claude Code v2.1.273+, same account), otherwise you get duplicates.
# ~/.claude/skills
